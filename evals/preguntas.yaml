- pregunta: ¿Argentina ganó la final del Mundial 2022 por suerte o por juego? Usá el xG y el relato.
  tipo: mixto
  verdad: >-
    select round(sum(case when is_penalty then 0 else xg end), 2) from fct_sb_shots s
    join fct_sb_team_matches m using (match_id, team_id) where m.competition_name = 'FIFA World Cup'
    and m.match_date = '2022-12-18' and s.team_name = 'Argentina' and s.period <= 4
  articulo: Final de la Copa Mundial de Fútbol de 2022
- pregunta: ¿Quién es el jugador más caro de la Premier y qué se sabe de su carrera?
  tipo: mixto
  verdad: >-
    select p.player_name from dim_players p join dim_clubs c on c.club_id = p.current_club_id
    where c.domestic_competition_id = 'GB1' order by p.market_value_eur desc nulls last limit 1
  articulo: Erling Haaland
