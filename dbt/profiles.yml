# Las credenciales nunca van al repo: todo sale de variables de entorno.
# dev  -> tu usuario (gcloud auth application-default login)
# prod -> service account (la usa Airflow)
fuchibol:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'fuchibol-dev') }}"
      dataset: "{{ env_var('DBT_DEV_DATASET', 'dev') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 900
      maximum_bytes_billed: 20000000000 # 20 GB por query: freno de seguridad de costos
    prod:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/opt/airflow/keys/sa.json') }}"
      project: "{{ env_var('GCP_PROJECT_ID', 'fuchibol-dev') }}"
      dataset: analytics
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 900
      maximum_bytes_billed: 20000000000
