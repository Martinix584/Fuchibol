version: 2

models:
  - name: ml_market_value_predictions
    description: Valor real vs. valor predicho por el modelo (scikit-learn, ingestion/ml.py) para la última temporada.
    data_tests:
      - unique_combination:
          arguments:
            columns: [player_id, season]
    columns:
      - name: predicted_value_eur
        data_tests: [not_null, non_negative]

  - name: ml_model_evaluation
    description: Métricas de evaluación del modelo (MAE, R², etc. sobre el log del valor).

  - name: ml_feature_importance
    description: Importancia global de cada variable.

  - name: mart_undervalued_players
    description: Ranking de jugadores subvaluados / sobrevaluados según el modelo.
    columns:
      - name: valuation_label
        data_tests:
          - accepted_values:
              arguments:
                values: [Subvaluado, Precio justo, Sobrevaluado]
